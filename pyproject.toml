[project]
name = "ds-aa-caf-flooding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.4"
dependencies = [
    "ipykernel>=7.1.0",
    "pre-commit>=4.5.1",
    "ruff>=0.14.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
  "E501",  # long lines (plots, URLs, arrays)
  "F841",  # assigned but unused (notebooks, exploration)
]

[tool.ruff.format]
quote-style = "double"
